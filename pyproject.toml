[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "hellforge"
version = "0.1.0-beta"
description = "E Language — a domain-specific language for piano music composition"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "HELLFORGE Contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
    "mido>=1.2",
    "numpy>=1.24",
    "scipy>=1.9",
]

[project.optional-dependencies]
audio = ["pygame>=2.0"]
full = ["pygame>=2.0", "pydub>=0.25", "psutil>=5.9", "lupa>=2.0"]

[project.scripts]
hellforge = "ep_compiler.cli:main"

[tool.setuptools]
py-modules = ["ep", "eshell", "ep_core", "ep_pkg", "ep_audio", "player", "piano_synth", "run"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B"]
ignore = [
    "E501",  # line too long — handled by formatter
    "E402",  # module import not at top — needed for sys.path hacks
    "N802",  # function name should be lowercase — _ prefixed internal funcs
    "N803",  # argument name should be lowercase
    "N806",  # variable in function should be lowercase
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
