[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B"]
ignore = [
    "E501",  # line too long — handled by formatter
    "E402",  # module import not at top — needed for sys.path hacks
    "N802",  # function name should be lowercase — _ prefixed internal funcs
    "N803",  # argument name should be lowercase
    "N806",  # variable in function should be lowercase
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
